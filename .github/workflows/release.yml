# Pushing a tag like v1.0.0 builds Amity-v1.0.0.zip with the BigWigs packager,
# uploads it to CurseForge and attaches it to a GitHub release.
#
# Needs the repository secret CF_API_KEY (CurseForge > My Profile > API tokens)
# and "## X-Curse-Project-ID: <id>" in Amity.toc.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
